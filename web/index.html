<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- nothing the page shows (model markdown, SVG figures) may load from or talk to anywhere else (under `bun run dev`
         this also blocks the dev server's inline tab-hidden beacon: one console message, nothing else changes) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>Chrysalis Inference</title>
    <link rel="icon" href="./logo.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- the side panels: the conversations (left) and Settings (right), alike. Each has a toggle fixed in its top
           corner, so it never moves; the chat's top bar and the panel's head leave it room. data-open is the state a
           panel starts in where it sits beside the chat (it is remembered from then on). -->
      <button id="conversations-toggle" class="act pane-toggle" data-side="left" type="button" aria-controls="sidebar" aria-label="Conversations" title="Conversations (Ctrl+B)"></button>
      <aside id="sidebar" class="pane" data-side="left" data-open tabindex="-1">
        <div class="pane-inner">
          <div class="pane-head"><span class="brand">Chrysalis</span></div>
          <div class="side-body">
            <button id="new-chat" class="btn" type="button"></button>
            <nav id="conversations" aria-label="Conversations"></nav>
            <div class="side-foot">
              <button id="import" class="btn" type="button" title="Add chats from files exported here">Import</button>
              <button id="export-all" class="btn" type="button" title="Every chat of this tab, in one file">Export all</button>
              <input id="import-file" type="file" accept=".json,application/json" multiple hidden />
            </div>
          </div>
          <div class="pane-rail" role="separator" aria-orientation="vertical"></div>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <h1 id="title">New chat</h1>
          <button id="export" class="act" type="button" title="Export this chat (a file you can import again)" aria-label="Export this chat" hidden></button>
        </header>
        <div id="scroller"><div id="thread" class="thread"></div></div>
        <form id="composer">
          <div class="composer-box">
            <button id="to-latest" class="act to-latest" type="button" title="Jump to the latest" aria-label="Jump to the latest" hidden></button>
            <div id="attachments" class="attachments" hidden></div>
            <textarea id="input" rows="1" placeholder="Message Chrysalis" autofocus></textarea>
            <div id="model-pop" class="model-pop" role="listbox" aria-label="Model" hidden></div>
            <div id="tools-pop" class="tools-pop" role="dialog" aria-label="Tools in this chat" hidden></div>
            <div id="voice-pop" class="model-pop voice-pop" hidden><div id="voice-meta" class="voice-meta"></div><div id="voice-list" role="listbox" aria-label="Voice"></div></div>
            <div class="composer-row">
              <button id="attach" class="act attach" type="button" title="Attach text files or pictures (or drop or paste them)" aria-label="Attach files"></button>
              <input id="attach-file" type="file" multiple hidden />
              <div class="think-ctl">
                <div id="energy" class="energy" role="slider" tabindex="0" aria-label="Thinking" aria-valuemin="0" aria-valuemax="3"></div>
                <div id="energy-stops" class="energy-stops"></div>
              </div>
              <button id="tools-btn" class="tools-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="tools-pop"></button>
              <span id="meter" class="meter"></span>
              <button id="model-btn" class="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="model-pop"></button>
              <button id="power" class="act power" type="button"></button>
              <button id="draft" class="draft" type="button" hidden></button>
              <button id="voice" class="voice" type="button" title="Voice mode" aria-label="Voice mode"></button>
              <!-- voice mode, as Grok has it: the message box stays and the chat is written above it as it is said; the
                   pill's dots move with the voice heard (yours, then the reply's), a click on them talks over the reply -->
              <div id="voice-pill" class="voice-pill" hidden>
                <button id="voice-dots" class="voice-dots" type="button"><i></i><i></i><i></i><i></i><i></i></button>
                <button id="voice-mute" class="voice-mic" type="button"></button>
              </div>
              <button id="voice-pick" class="model-btn voice-pick" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="voice-pop" hidden></button>
              <button id="send" class="send" type="submit" aria-label="Send"></button>
            </div>
          </div>
          <p class="hint"><span class="hint-text">Enter to send · Shift+Enter for a new line · Esc stops the reply</span><span class="voice-hint-line"><span id="voice-status" role="status" aria-live="polite"></span><span class="voice-keys"> · Esc talks over the reply · ■ ends voice mode</span></span></p>
        </form>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </main>
      <!-- Settings: a panel beside the chat, not a dialog over it, so a change can be tried at once (Regenerate) and
           compared; every change applies as it is made, and what it shows is exactly what Chrysalis is sent -->
      <button id="settings-toggle" class="act pane-toggle" data-side="right" type="button" aria-controls="settings" aria-label="Settings" title="Settings (Ctrl+,)"></button>
      <aside id="settings" class="pane" data-side="right" aria-label="Settings" tabindex="-1">
        <div class="pane-inner">
          <header class="pane-head">
            <h2>Settings</h2>
            <span>every chat in this tab</span>
          </header>
          <div class="set-body">
            <section class="set-sec">
              <div class="set-sec-head"><label class="set-title" for="system-input">System prompt</label><button id="system-reset" class="act knob-reset" type="button" title="Back to the default system prompt" aria-label="Restore the default system prompt"></button></div>
              <textarea id="system-input" rows="2" placeholder="No system prompt" title="Sent as written, {{MODEL}} as the chat's model; empty sends none. The default keeps the model from acting as a coding agent when it doesn't think, and is sent as its tools version in a chat with tools on. A change makes each chat read its history again once."></textarea>
              <p id="system-note" class="set-note" hidden></p>
              <button id="sent-open" class="btn small" type="button" title="The open chat's next request, exactly as Chrysalis gets it: the tools, the system prompt and every message">What the model is sent</button>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Sampling</span><span class="set-aside"><button id="order-reset" class="act knob-reset" type="button" title="Back to the default order" aria-label="Restore the default order"></button><span id="mode-note" title="Set by the thinking bar in the message box"></span></span></div>
              <figure id="odds-first" class="odds" title="Qwen3.8-Flash-Next naming a cat (thinking off): 2,000 real draws of the first word"><div class="odd-head">Qwen names a cat</div></figure>
              <div id="samplers" class="knobs"></div>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Repetition</span></div>
              <figure id="odds-next" class="odds" title="Qwen3.8-Flash-Next listing cat names (thinking off): the next token's real odds"><div id="odds-line" class="odd-head odd-line"></div></figure>
              <div id="repetition" class="knobs"></div>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Reply</span></div>
              <div id="reply-knobs" class="knobs"></div>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><label class="set-title" for="voice-prompt">Voice mode</label><button id="voice-prompt-reset" class="act knob-reset" type="button" title="Back to the default voice prompt" aria-label="Restore the default voice prompt"></button></div>
              <textarea id="voice-prompt" class="prompt-input" rows="6" placeholder="No prompt" title="A note to the model before the first question said aloud (and again when it changes); the system prompt stays as it is. What the reply writes is spoken."></textarea>
              <div id="voice-knobs" class="knobs"></div>
            </section>
            <!-- what the config file sets up, read-only: the page can reload the file, never change what a server runs -->
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Tools</span><button id="tools-reload" class="btn small" type="button" title="Read the config file again (servers that changed restart)">Reload config</button></div>
              <div id="tools-list" class="tools-list"></div>
              <div id="tools-knobs" class="knobs"></div>
              <div id="allow-list" class="allow-list"></div>
            </section>
          </div>
          <footer class="set-foot"><button id="settings-reset" class="btn" type="button"
            title="The default system prompt and Qwen's recommended values, with thinking and without (Undo brings yours back)">Reset all settings</button></footer>
          <div class="pane-rail" role="separator" aria-orientation="vertical"></div>
        </div>
      </aside>
    </div>
    <div id="tokpop" class="tokpop" role="dialog" aria-label="Alternatives" hidden></div>
    <dialog id="svg-zoom" class="svg-zoom" aria-label="SVG, full size"><div class="svg-zoom-paper"></div></dialog>
    <dialog id="page-zoom" class="page-zoom" aria-label="Page, full size"><div class="page-zoom-box"></div></dialog>
    <!-- What the model is sent: read-only, from the web server's own build of the next request (/api/preview) -->
    <dialog id="sent-view" class="sent-view" aria-labelledby="sent-title">
      <header class="sent-head"><h2 id="sent-title">What the model is sent</h2><button id="sent-copy" class="btn small" type="button">Copy</button><button id="sent-close" class="act" type="button" aria-label="Close"></button></header>
      <p id="sent-about" class="set-note"></p>
      <pre id="sent-text" class="sent-text"></pre>
    </dialog>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
