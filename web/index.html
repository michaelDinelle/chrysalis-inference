<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kiln</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f07a3c' d='M12 1.5c.9 3.6-.9 5.9-2.6 7.9C7.8 11.2 6 13.1 6 15.9 6 19.3 8.7 22 12 22s6-2.6 6-6.2c0-2.7-1.4-4.7-2.6-6.1-.3 1.6-1.2 2.7-2.4 3.2 1-3.9-.2-8.1-1-11.4z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand"><span id="brand-mark"></span>kiln</div>
        <button id="new-chat" class="new-chat" type="button"></button>
        <nav id="conversations" aria-label="Conversations"></nav>
        <div id="status" class="status"></div>
      </aside>
      <div id="scrim"></div>
      <main>
        <header class="topbar">
          <button id="menu" class="act" type="button" aria-label="Conversations"></button>
          <h1 id="title">New chat</h1>
          <button id="system-btn" class="ghost-btn" type="button">System prompt</button>
        </header>
        <div id="scroller"><div id="thread" class="thread"></div></div>
        <form id="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="Message kiln" autofocus></textarea>
            <div class="composer-row">
              <div id="effort" class="segmented" role="radiogroup" aria-label="Thinking"></div>
              <span id="meter" class="meter"></span>
              <button id="send" class="send" type="submit" aria-label="Send"></button>
            </div>
          </div>
          <p class="hint">Enter to send · Shift+Enter for a new line · Esc stops the reply</p>
        </form>
      </main>
    </div>
    <dialog id="system-dialog">
      <form method="dialog">
        <h2>System prompt</h2>
        <p>Instructions for this conversation. Changing them makes kiln re-read the conversation once.</p>
        <textarea id="system-input" rows="8" placeholder="You are a concise senior engineer…"></textarea>
        <div class="dialog-actions">
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="save" class="primary-btn">Save</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
