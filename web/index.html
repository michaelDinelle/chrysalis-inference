<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- nothing the page shows (model markdown, SVG figures) may load from or talk to anywhere else (under `bun run dev`
         this also blocks the dev server's inline tab-hidden beacon: one console message, nothing else changes) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>kiln</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f07a3c' d='M12 1.5c.9 3.6-.9 5.9-2.6 7.9C7.8 11.2 6 13.1 6 15.9 6 19.3 8.7 22 12 22s6-2.6 6-6.2c0-2.7-1.4-4.7-2.6-6.1-.3 1.6-1.2 2.7-2.4 3.2 1-3.9-.2-8.1-1-11.4z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand"><span id="brand-mark"></span>kiln</div>
        <button id="new-chat" class="new-chat" type="button"></button>
        <nav id="conversations" aria-label="Conversations"></nav>
        <div id="model-menu" class="model-menu" role="menu" aria-label="Model" hidden></div>
        <div id="status" class="status"></div>
      </aside>
      <div id="scrim"></div>
      <main>
        <header class="topbar">
          <button id="menu" class="act" type="button" aria-label="Conversations"></button>
          <h1 id="title">New chat</h1>
          <button id="settings-btn" class="top-btn" type="button" aria-controls="settings" aria-expanded="false" title="Settings (Ctrl+,)"></button>
        </header>
        <div id="scroller"><div id="thread" class="thread"></div></div>
        <form id="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="Message kiln" autofocus></textarea>
            <div class="composer-row">
              <div class="choices">
                <div id="effort" class="segmented" role="radiogroup" aria-label="Thinking"></div>
              </div>
              <span id="meter" class="meter"></span>
              <button id="draft" class="draft" type="button" hidden></button>
              <button id="send" class="send" type="submit" aria-label="Send"></button>
            </div>
          </div>
          <p class="hint">Enter to send · Shift+Enter for a new line · Esc stops the reply</p>
        </form>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </main>
      <!-- Settings: a panel beside the chat, not a dialog over it, so a change can be tried at once (Regenerate) and
           compared; every change applies as it is made, and what it shows is exactly what kiln is sent -->
      <aside id="settings" class="settings" aria-label="Settings" tabindex="-1" inert>
        <div class="settings-inner">
          <header class="set-head">
            <h2>Settings</h2>
            <span>every chat in this tab</span>
            <button id="settings-close" class="act" type="button" aria-label="Close settings" title="Close (Esc)"></button>
          </header>
          <div class="set-body">
            <section class="set-sec">
              <div class="set-sec-head"><label class="set-title" for="system-input">System prompt</label><button id="system-reset" class="set-link" type="button" hidden>Restore default</button></div>
              <textarea id="system-input" rows="2" placeholder="No system prompt" title="Sent as written; empty sends none. The default keeps the model from acting as a coding agent when it doesn't think. A change makes each chat read its history again once."></textarea>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Sampling</span><span class="set-aside"><button id="order-reset" class="set-link" type="button" hidden>Default order</button><span id="mode-note" title="Set by Think in the message box"></span></span></div>
              <figure id="odds-first" class="odds" title="Qwen3.8-Flash-Next naming a cat (thinking off): 2,000 real draws of the first word"><div class="odd-head">Qwen names a cat</div></figure>
              <div id="samplers" class="knobs"></div>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Repetition</span></div>
              <figure id="odds-next" class="odds" title="Qwen3.8-Flash-Next listing cat names (thinking off): the next token's real odds"><div id="odds-line" class="odd-head odd-line"></div></figure>
              <div id="repetition" class="knobs"></div>
            </section>
            <section class="set-sec">
              <div class="set-sec-head"><span class="set-title">Reply</span></div>
              <div id="reply-knobs" class="knobs"></div>
            </section>
          </div>
          <footer class="set-foot"><button id="settings-reset" class="ghost-btn reset-all" type="button"
            title="The default system prompt and Qwen's recommended values, with thinking and without (Undo brings yours back)">Reset all settings</button></footer>
        </div>
      </aside>
    </div>
    <div id="tokpop" class="tokpop" role="dialog" aria-label="Alternatives" hidden></div>
    <dialog id="svg-zoom" class="svg-zoom" aria-label="SVG, full size"><div class="svg-zoom-paper"></div></dialog>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
